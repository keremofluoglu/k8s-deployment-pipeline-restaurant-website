apiVersion: apps/v1
kind: Deployment
metadata:
  name: restoran-deployment   # "deploymet" yazım hatası düzeltildi
  namespace: default
spec:
  replicas: 1                 # 3'ten 1'e düşürüldü — açıklama aşağıda
  selector:
    matchLabels:
      app: restoran
  template:
    metadata:
      labels:
        app: restoran
    spec:
      containers:
        - name: restoran
          image: restoran:v1
          ports:
            - containerPort: 5000   # app.py port 5000'de çalışıyor, 8080 değil
          env:
            # Secret'taki değerleri env variable olarak pod'a aktar
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: restoran-service
  namespace: default
spec:
  selector:
    app: restoran
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000    # containerPort ile eşleşiyor
  type: ClusterIP         # Ingress üzerinden erişilecek, LoadBalancer gerekmez

# NOT — replicas neden 1?
# PostgreSQL 1 pod, PVC ReadWriteOnce modunda.
# 3 Flask pod aynı anda aynı DB'ye yazabilir (bu sorun değil),
# ama başlangıç için 1 daha basit ve hatasız çalışır.
# İleride artırmak istersen replicas: 3 yapabilirsin.
