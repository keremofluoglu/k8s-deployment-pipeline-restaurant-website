apiVersion: apps/v1
kind: Deployment
metadata:
  name: restoran-deployment   
  namespace: default
spec:
  replicas: 3                
  selector:
    matchLabels:
      app: restoran
  template:
    metadata:
      labels:
        app: restoran
    spec:
      containers:
        - name: restoran
          image: restoran:v1
          ports:
            - containerPort: 5000   
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-host
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restoran-secret
                  key: db-password
---
apiVersion: v1
kind: Service
metadata:
  name: restoran-service
  namespace: default
spec:
  selector:
    app: restoran
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000    
  type: ClusterIP         